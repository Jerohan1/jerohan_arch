$scriptsDir = $scripts

# Apps
bind = SUPER, D, exec, vesktop
bind = SUPER, B, exec, $browser
bind = SUPER, Return, exec, $terminal
bind = SUPER, E, exec, $fileExplorer

# Noctalia shell ---------------------------------------------------------

$ipc = qs -c noctalia-shell ipc call

# Core Functions
bindr = SUPER, A, exec, $ipc launcher toggle
bind = SUPER, S, exec, $ipc controlCenter toggle
bind = SUPER, comma, exec, $ipc settings toggle

# Quick Access
bind = SUPER, V, exec, $ipc launcher clipboard
bind = SUPER, P, exec, $ipc sessionMenu toggle
bind = SUPER, L, exec, $ipc lockScreen lock
bind = Ctrl Shift, Escape, exec, $ipc systemMonitor toggle

# Audio Management
bindel = , XF86AudioRaiseVolume, exec, $ipc volume increase
bindel = , XF86AudioLowerVolume, exec, $ipc volume decrease
bindl = , XF86AudioMute, exec, $ipc volume muteOutput

# Media Controls
bind = SUPER, M, exec, $ipc media toggle
bind = , xf86AudioPlayPause, exec, $ipc media playPause
bind = , xf86AudioNext, exec, $ipc media next
bind = , xf86AudioPrev, exec, $ipc media previous

# Display & Brightness
bindel = , XF86MonBrightnessUp, exec, $ipc brightness increase
bindel = , XF86MonBrightnessDown, exec, $ipc brightness decrease

# Wallpaper Management
bind = SUPER, w, exec, $ipc wallpaper toggle
bind = SUPER Shift, w, exec, $ipc wallpaper random

# ------------------------------------------------------------------------

# Window adjustment
bindd = SUPER, F, fullscreen, fullscreen
bindd = SUPER Shift, F, maximize window, fullscreen, 1
bindd = SUPER, SPACE, Float current window, togglefloating,

# Desktop zooming or magnifier
bindd = SUPER ALT, mouse_down, zoom in, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 2.0}')"
bindd = SUPER ALT, mouse_up, zoom out, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 2.0}')"

# Move current workspaces to monitors (left right up or down)
bindd = SUPER CTRL, F9, move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = SUPER CTRL, F10, move workspace to right monitor, movecurrentworkspacetomonitor, r
bindd = SUPER CTRL, F11, move workspace to up monitor, movecurrentworkspacetomonitor, u
bindd = SUPER CTRL, F12, move workspace to down monitor, movecurrentworkspacetomonitor, d

#### SYSTEM ####
bindd = CTRL ALT, Delete, exit Hyprland, exec, hyprctl dispatch exit 0
bindd = SUPER, Q, close active window, killactive,
bindd = SUPER SHIFT, Q, Terminate active process, exec, $scriptsDir/KillActiveProcess.sh

# Cycle windows; if floating bring to top
bindd = ALT, tab, cycle next window, cyclenext
bindd = ALT, tab, bring active to top, bringactivetotop

# Screenshot keybindings NOTE: You may need to press Fn key as well
bindd = SUPER, Print, screenshot now, exec, $scriptsDir/ScreenShot.sh --now
bindd = SUPER SHIFT, Print, screenshot (area), exec, $scriptsDir/ScreenShot.sh --area
bindd = SUPER CTRL, Print, screenshot in 5s, exec, $scriptsDir/ScreenShot.sh --in5
bindd = SUPER CTRL SHIFT, Print, screenshot in 10s, exec, $scriptsDir/ScreenShot.sh --in10
bindd = ALT, Print, screenshot active window, exec, $scriptsDir/ScreenShot.sh --active
bindd = SUPER SHIFT, S, screenshot (swappy), exec, $scriptsDir/ScreenShot.sh --swappy

# Resize windows
binded = SUPER SHIFT, left, resize left (-50), resizeactive, -50 0
binded = SUPER SHIFT, right, resize right (+50), resizeactive, 50 0
binded = SUPER SHIFT, up, resize up (-50), resizeactive, 0 -50
binded = SUPER SHIFT, down, resize down (+50), resizeactive, 0 50
bindm = SUPER, X, resizewindow

# Move windows
bindd = SUPER CTRL, left, move window left, movewindow, l
bindd = SUPER CTRL, right, move window right, movewindow, r
bindd = SUPER CTRL, up, move window up, movewindow, u
bindd = SUPER CTRL, down, move window down, movewindow, d

# Swap windows
bindd = SUPER ALT, left, swap window left, swapwindow, l
bindd = SUPER ALT, right, swap window right, swapwindow, r
bindd = SUPER ALT, up, swap window up, swapwindow, u
bindd = SUPER ALT, down, swap window down, swapwindow, d

# group
bindd = SUPER, G, toggle group, togglegroup

# Navigate within a group
bindd = SUPER, Tab, Change Group Forward, changegroupactive, f
bindd = SUPER CTRL, tab, change active in group, changegroupactive
bindd = SUPER SHIFT, Tab, Change Group Back, changegroupactive, b

# Move window into/out of group
bindd = SUPER CTRL, K, Move left into group, moveintogroup, l # Move active window left into a group A
bindd = SUPER CTRL, L, Move Right into group, moveintogroup, r # Move active window right into a group
bindd = SUPER CTRL, H, Move active out of group, moveoutofgroup # Move active window out of group

# Try to dynamically move in grouped window and when ungrouped
#  Not working for me DW 11/26/25  PR: https://github.com/JaKooLit/Hyprland-Dots/pull/872
#bindd = SUPER, right, focus right, exec, bash -c 'if hyprctl activewindow -j | jq -e "((.grouped | type) == \"boolean\") or (.address == (.grouped[-1] // empty))" >/dev/null 2>&1; then hyprctl dispatch movefocus r; else hyprctl dispatch changegroupactive f; fi'
#bindd = SUPER, left, focus left, exec, bash -c 'if hyprctl activewindow -j | jq -e "((.grouped | type) == \"boolean\") or (.address == (.grouped[0] // empty))" >/dev/null 2>&1; then hyprctl dispatch movefocus l; else hyprctl dispatch changegroupactive b; fi'

# Move focus with mainMod + arrow keys
bindd = SUPER, left, focus left, movefocus, l
bindd = SUPER, right, focus right, movefocus, r
bindd = SUPER, up, focus up, movefocus, u
bindd = SUPER, down, focus down, movefocus, d

# Workspaces related
bindd = SUPER, tab, next workspace, workspace, m+1
bindd = SUPER SHIFT, tab, previous workspace, workspace, m-1

# Special workspace
bindd = SUPER SHIFT, U, move to special workspace, movetoworkspace, special
bindd = SUPER, U, toggle special workspace, togglespecialworkspace,

bind = $kbSystemMonitor, exec, caelestia toggle sysmon
bind = $kbMusic, exec, caelestia toggle music
bind = $kbCommunication, exec, caelestia toggle communication

# The following mappings use the key codes to better support various keyboard layouts
# 1 is code:10, 2 is code 11, etc
# Switch workspaces with mainMod + [0-9]
bindd = SUPER, code:10, workspace 1, workspace, 1 # NOTE: code:10 = key 1
bindd = SUPER, code:11, workspace 2, workspace, 2 # NOTE: code:11 = key 2
bindd = SUPER, code:12, workspace 3, workspace, 3 # NOTE: code:12 = key 3
bindd = SUPER, code:13, workspace 4, workspace, 4 # NOTE: code:13 = key 4
bindd = SUPER, code:14, workspace 5, workspace, 5 # NOTE: code:14 = key 5
bindd = SUPER, code:15, workspace 6, workspace, 6 # NOTE: code:15 = key 6
bindd = SUPER, code:16, workspace 7, workspace, 7 # NOTE: code:16 = key 7
bindd = SUPER, code:17, workspace 8, workspace, 8 # NOTE: code:17 = key 8
bindd = SUPER, code:18, workspace 9, workspace, 9 # NOTE: code:18 = key 9
bindd = SUPER, code:19, workspace 10, workspace, 10 # NOTE: code:19 = key 0

# Move active window and follow to workspace mainMod + SHIFT [0-9]
bindd = SUPER SHIFT, code:10, move to workspace 1, movetoworkspace, 1 # NOTE: code:10 = key 1
bindd = SUPER SHIFT, code:11, move to workspace 2, movetoworkspace, 2 # NOTE: code:11 = key 2
bindd = SUPER SHIFT, code:12, move to workspace 3, movetoworkspace, 3 # NOTE: code:12 = key 3
bindd = SUPER SHIFT, code:13, move to workspace 4, movetoworkspace, 4 # NOTE: code:13 = key 4
bindd = SUPER SHIFT, code:14, move to workspace 5, movetoworkspace, 5 # NOTE: code:14 = key 5
bindd = SUPER SHIFT, code:15, move to workspace 6, movetoworkspace, 6 # NOTE: code:15 = key 6
bindd = SUPER SHIFT, code:16, move to workspace 7, movetoworkspace, 7 # NOTE: code:16 = key 7
bindd = SUPER SHIFT, code:17, move to workspace 8, movetoworkspace, 8 # NOTE: code:17 = key 8
bindd = SUPER SHIFT, code:18, move to workspace 9, movetoworkspace, 9 # NOTE: code:18 = key 9
bindd = SUPER SHIFT, code:19, move to workspace 10, movetoworkspace, 10 # NOTE: code:19 = key 0
bindd = SUPER SHIFT, bracketleft, move to previous workspace, movetoworkspace, -1 # brackets [
bindd = SUPER SHIFT, bracketright, move to next workspace, movetoworkspace, +1 # brackets ]

# Move active window to a workspace silently mainMod + CTRL [0-9]
bindd = SUPER CTRL, code:10, move silently to workspace 1, movetoworkspacesilent, 1 # NOTE: code:10 = key 1
bindd = SUPER CTRL, code:11, move silently to workspace 2, movetoworkspacesilent, 2 # NOTE: code:11 = key 2
bindd = SUPER CTRL, code:12, move silently to workspace 3, movetoworkspacesilent, 3 # NOTE: code:12 = key 3
bindd = SUPER CTRL, code:13, move silently to workspace 4, movetoworkspacesilent, 4 # NOTE: code:13 = key 4
bindd = SUPER CTRL, code:14, move silently to workspace 5, movetoworkspacesilent, 5 # NOTE: code:14 = key 5
bindd = SUPER CTRL, code:15, move silently to workspace 6, movetoworkspacesilent, 6 # NOTE: code:15 = key 6
bindd = SUPER CTRL, code:16, move silently to workspace 7, movetoworkspacesilent, 7 # NOTE: code:16 = key 7
bindd = SUPER CTRL, code:17, move silently to workspace 8, movetoworkspacesilent, 8 # NOTE: code:17 = key 8
bindd = SUPER CTRL, code:18, move silently to workspace 9, movetoworkspacesilent, 9 # NOTE: code:18 = key 9
bindd = SUPER CTRL, code:19, move silently to workspace 10, movetoworkspacesilent, 10 # NOTE: code:19 = key 0
bindd = SUPER CTRL, bracketleft, move silently to previous workspace, movetoworkspacesilent, -1 # brackets [
bindd = SUPER CTRL, bracketright, move silently to next workspace, movetoworkspacesilent, +1 # brackets ]

# Scroll through existing workspaces with SUPER + scroll
bindd = SUPER, mouse_down, next workspace, workspace, e+1
bindd = SUPER, mouse_up, previous workspace, workspace, e-1
bindd = SUPER, period, next workspace, workspace, e+1
bindd = SUPER, comma, previous workspace, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = SUPER, mouse:272, move window, movewindow # NOTE: mouse:272 = left click
bindmd = SUPER, mouse:273, resize window, resizewindow # NOTE: mouse:272 = right click
